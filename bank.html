        <form  onsubmit="myFunc(event)">
            <div>
                <label>name</label>
            <input id="full_name" type="text" placeholder="enter name">
        </div>
        <div>
         <label id="gender">gender</label>
         <input type="radio">men
         <input type="radio">women
        </div>
        <div>
            <label>email</label>
            <input type="text" id="email" placeholder="email">
        </div>
        <div>
            <label>date of birth</label>
            <input type="date" id="date_of_birth" placeholder="date of birth">
        </div>
        <input type="submit" value="submit">
        </form>
        <script>
            function myFunc(event){
                event.preventDefault();
          
            var full_name=document.getElementById("full_name").value;
            var gender=document.getElementById("gender");
            var email=document.getElementById("email").value;
            var date_of_birth=document.getElementById("date_of_birth").value;

            gender.checked ?gender="male":gender="female";
            localStorage.setItem('is_full_name',full_name);
            localStorage.setItem('is_gender',gender);
            localStorage.setItem('is_date_of_birth',date_of_birth);
            localStorage.setItem('email',email);
        }
        </script>
